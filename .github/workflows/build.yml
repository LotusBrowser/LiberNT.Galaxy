name: Lotus Build

on:
  push:
    branches: [main-nt10]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - 'translations/**'
      - '.github/ISSUE_TEMPLATE/**'
  # pull_request trigger REMOVED: PRs are not "merges from Lotus Actions".
  workflow_dispatch:
    inputs:
      arch:
        description: Architecture to build
        type: choice
        options: [amd64, arm64, riscv64, i386, all]
        default: amd64
      build_type:
        description: Build type
        type: choice
        options: [debug, release]
        default: debug

concurrency:
  group: lotus-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan build matrix
    # Only build when:
    #   - manually triggered, OR
    #   - a tag was pushed (release), OR
    #   - the commit pushed to main-nt10 was authored by "Lotus Actions"
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.ref_type == 'tag' ||
      (github.event_name == 'push' &&
       github.event.head_commit.author.name  == 'Lotus Actions' &&
       github.event.head_commit.author.email == 'noreply@browselotus.net')
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      buildtype: ${{ steps.plan.outputs.buildtype }}
    steps:
      - name: Choose architectures and build type
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_ARCH: ${{ inputs.arch }}
          INPUT_TYPE: ${{ inputs.build_type }}
        run: |
          # Tags build Release for amd64 and arm64; manual runs follow the inputs;
          # everything else is a Debug amd64 build, as on the LotusOS CI.
          buildtype=debug
          arches=amd64
          if [ "$REF_TYPE" = tag ]; then
            buildtype=release
            arches="amd64 arm64"
          elif [ "$EVENT" = workflow_dispatch ]; then
            buildtype="$INPUT_TYPE"
            arches="$INPUT_ARCH"
            [ "$arches" = all ] && arches="amd64 arm64 riscv64 i386"
          fi

          # Compiler and board profile per architecture, as in the LotusOS build workflow.
          entry() {
            case "$1" in
              amd64)   echo '{"arch":"amd64","compiler":"clang","profile":""}' ;;
              arm64)   echo '{"arch":"arm64","compiler":"clang","profile":"profile_raspberry"}' ;;
              riscv64) echo '{"arch":"riscv64","compiler":"clang","profile":"profile_spacemit_k1"}' ;;
              i386)    echo '{"arch":"i386","compiler":"gcc","profile":""}' ;;
            esac
          }
          matrix="{\"include\":[$(for a in $arches; do entry "$a"; done | paste -sd, -)]}"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "buildtype=$buildtype" >> "$GITHUB_OUTPUT"
          echo "Building: $arches ($buildtype)"

  build:
    name: ${{ matrix.arch }} (${{ matrix.compiler }}, ${{ needs.plan.outputs.buildtype }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/lib/jvm /usr/local/share/powershell /usr/local/share/chromium
          sudo docker system prune --all --force
          df -h /

      - name: Source checkout
        uses: actions/checkout@v6

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build flex bison ccache wget xz-utils tar python3-mako python3-yaml python3-packaging glslang-tools msitools

      # RosBE is the cross-build toolchain. The cache key is the hash of its bootstrap script,
      # so a new toolchain release invalidates the cache.
      - name: Compute RosBE bootstrap SHA
        id: rosbe_spec
        run: |
          curl -fsSL https://raw.githubusercontent.com/LiberNT/libernt-build-toolchain/main/rosbe-unix-bootstrap.sh -o /tmp/rosbe-bootstrap.sh
          echo "sha=$(sha1sum /tmp/rosbe-bootstrap.sh | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Cache RosBE
        id: cache_rosbe
        uses: actions/cache@v5
        with:
          path: ~/.local/opt/rosbe
          key: rosbe-${{ runner.os }}-${{ steps.rosbe_spec.outputs.sha }}

      - name: Install RosBE
        if: ${{ steps.cache_rosbe.outputs.cache-hit != 'true' }}
        run: sh /tmp/rosbe-bootstrap.sh

      - name: Restore ccache
        id: ccache_restore
        uses: actions/cache/restore@v5
        with:
          path: ccache
          key: ccache-lotus-${{ matrix.compiler }}-${{ matrix.arch }}-${{ needs.plan.outputs.buildtype }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-lotus-${{ matrix.compiler }}-${{ matrix.arch }}-${{ needs.plan.outputs.buildtype }}-

      - name: Set ccache settings
        run: |
          echo "CCACHE_BASEDIR=${{ github.workspace }}" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=${{ github.workspace }}/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=1G" >> "$GITHUB_ENV"
          echo "CCACHE_SLOPPINESS=time_macros" >> "$GITHUB_ENV"

      - name: Configure
        id: configure
        env:
          ARCH: ${{ matrix.arch }}
          COMPILER: ${{ matrix.compiler }}
          PROFILE: ${{ matrix.profile }}
          BUILDTYPE: ${{ needs.plan.outputs.buildtype }}
        run: |
          . "$HOME/.local/opt/rosbe/rosbe-env.sh"
          FLAGS=""
          [ "$COMPILER" = clang ] && FLAGS="$FLAGS --clang"
          [ "$COMPILER" = gcc ] && FLAGS="$FLAGS --gcc"
          [ "$BUILDTYPE" = release ] && FLAGS="$FLAGS --release"
          [ -n "$PROFILE" ] && FLAGS="$FLAGS -DROSCONFIG_PROFILE=$PROFILE"
          if [ "$COMPILER" = clang ]; then
            case "$ARCH" in amd64|arm64|riscv64) FLAGS="$FLAGS -DENABLE_MESA_LLVMPIPE=ON" ;; esac
          fi
          ./configure.sh $FLAGS -a "$ARCH" \
            -DREACTOS_TARGET_NT=0xA00 \
            -DDIAGDATA_CHANNEL= \
            -DENABLE_CCACHE=1
          ENV_NAME=$([ "$COMPILER" = clang ] && echo Clang || echo GCC)
          echo "outdir=output-$ENV_NAME-$ARCH-$BUILDTYPE" >> "$GITHUB_OUTPUT"

      - name: Build submodules
        run: |
          . "$HOME/.local/opt/rosbe/rosbe-env.sh"
          ninja -C "${{ steps.configure.outputs.outdir }}" submodules

      - name: Build images
        run: |
          . "$HOME/.local/opt/rosbe/rosbe-env.sh"
          ninja -C "${{ steps.configure.outputs.outdir }}" bootcd liberntimg liberntvhd -k0

      - name: Print ccache statistics
        if: ${{ always() && steps.ccache_restore.outcome == 'success' }}
        run: ccache -s

      - name: Save ccache
        if: ${{ always() && steps.ccache_restore.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: ccache
          key: ${{ steps.ccache_restore.outputs.cache-primary-key }}

      - name: Name artifacts
        id: images
        run: echo "tag=${{ matrix.arch }}-${{ needs.plan.outputs.buildtype }}-${GITHUB_SHA::11}" >> "$GITHUB_OUTPUT"

      - name: Upload bootcd.iso
        uses: actions/upload-artifact@v7
        with:
          name: LotusOS-bootcd-iso-${{ steps.images.outputs.tag }}
          path: ${{ steps.configure.outputs.outdir }}/bootcd.iso
          if-no-files-found: error

      - name: Upload LotusOS.img
        uses: actions/upload-artifact@v7
        with:
          name: LotusOS-img-${{ steps.images.outputs.tag }}
          path: ${{ steps.configure.outputs.outdir }}/LotusOS.img
          if-no-files-found: error

      - name: Upload LotusOS.vhd
        uses: actions/upload-artifact@v7
        with:
          name: LotusOS-vhd-${{ steps.images.outputs.tag }}
          path: ${{ steps.configure.outputs.outdir }}/LotusOS.vhd
          if-no-files-found: error

      - name: Upload LotusOS.vhdx
        uses: actions/upload-artifact@v7
        with:
          name: LotusOS-vhdx-${{ steps.images.outputs.tag }}
          path: ${{ steps.configure.outputs.outdir }}/LotusOS.vhdx
          if-no-files-found: error

      - name: Check build dependencies
        run: python3 sdk/tools/depcheck.py "${{ steps.configure.outputs.outdir }}" --mode depfiles --nested --fail-on-gaps

  release:
    name: Publish pre-release
    if: ${{ github.ref_type == 'tag' }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download the built images
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" --dir images

      - name: Zip each image
        run: |
          mkdir dist
          for d in images/*/; do
            n=$(basename "$d")
            (cd "$d" && zip -q -r "../../dist/$n.zip" .)
          done
          ls -lh dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.zip \
            --repo "${{ github.repository }}" \
            --title "LotusOS ${{ github.ref_name }}" \
            --prerelease \
            --notes "Release build of LotusOS from commit ${GITHUB_SHA::11}. Run it in a virtual machine or on spare hardware, not on a computer you depend on."
