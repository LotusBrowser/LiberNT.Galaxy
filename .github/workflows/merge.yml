name: Auto-Merge LiberNT Branch

on:
  schedule:
    # Every 30 minutes (UTC): 00:00, 00:30, 01:00, 01:30, ...
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: auto-merge-libernt
  cancel-in-progress: false

jobs:
  merge-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          ref: main-nt10
          fetch-depth: 0
          token: ${{ secrets.LOTUS_ACTIONS_PAT }}

      - name: Configure Git as Lotus Actions
        run: |
          git config user.name  "Lotus Actions"
          git config user.email "noreply@browselotus.net"

      - name: Add LiberNT/LiberNT as a remote
        run: |
          git remote add libernt https://github.com/LiberNT/LiberNT.git

      - name: Fetch the source branch
        run: |
          git fetch libernt main-nt10

      - name: Check if merge is needed
        id: check
        run: |
          if git merge-base --is-ancestor libernt/main-nt10 HEAD; then
            echo "needs_merge=false" >> $GITHUB_OUTPUT
            echo "Source branch is already merged."
          else
            echo "needs_merge=true" >> $GITHUB_OUTPUT
            echo "Source branch has new commits. Merging..."
          fi

      - name: Merge and push
        if: steps.check.outputs.needs_merge == 'true'
        run: |
          git merge libernt/main-nt10 --no-ff --allow-unrelated-histories \
            -m "Merge LiberNT/LiberNT main-nt10 into main-nt10"
          git push origin main-nt10
