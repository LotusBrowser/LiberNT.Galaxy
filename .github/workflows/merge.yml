name: Auto-Merge LiberNT Branch

on:
  schedule:
    # Every 15 minutes (UTC)
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: auto-merge-libernt
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: https://github.com/LiberNT/LiberNT.git
  UPSTREAM_BRANCH: main-nt10
  TARGET_BRANCH: main-nt10
  # Optional: a command that must pass after merging, e.g. "dotnet build" or "npm ci && npm run build".
  # Leave empty to skip.
  BUILD_CMD: ""

jobs:
  merge-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.LOTUS_ACTIONS_PAT }}

      - name: Configure Git as Lotus Actions
        run: |
          git config user.name  "Lotus Actions"
          git config user.email "noreply@browselotus.net"

      - name: Skip if a sync PR is already open
        id: pending
        env:
          GH_TOKEN: ${{ secrets.LOTUS_ACTIONS_PAT }}
        run: |
          COUNT=$(gh pr list --state open --base "$TARGET_BRANCH" \
            --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("libernt-sync/"))] | length')
          if [ "$COUNT" -gt 0 ]; then
            echo "A libernt-sync PR is still open. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add LiberNT/LiberNT as a remote and fetch
        if: steps.pending.outputs.skip == 'false'
        run: |
          git remote add libernt "$UPSTREAM_REPO"
          git fetch libernt "$UPSTREAM_BRANCH"

      - name: Check if merge is needed
        if: steps.pending.outputs.skip == 'false'
        id: check
        run: |
          if git merge-base --is-ancestor "libernt/$UPSTREAM_BRANCH" HEAD; then
            echo "needs_merge=false" >> "$GITHUB_OUTPUT"
            echo "Source branch is already merged."
          else
            echo "needs_merge=true" >> "$GITHUB_OUTPUT"
            echo "Source branch has new commits."
          fi

      - name: Smart merge (protect, resolve, rewrite, verify)
        if: steps.check.outputs.needs_merge == 'true'
        id: smart
        run: bash .github/scripts/galaxy-merge.sh

      - name: Commit the merge
        if: steps.check.outputs.needs_merge == 'true'
        run: |
          git add -A
          git commit -m "Merge LiberNT into LiberNT: Galaxy Edition" \
                     -m "$(cat "$RUNNER_TEMP/galaxy/review.md")"

      - name: Push directly (nothing needs review)
        if: steps.check.outputs.needs_merge == 'true' && steps.smart.outputs.needs_review == 'false'
        run: git push origin "$TARGET_BRANCH"

      - name: Push to branch and open PR (needs review)
        if: steps.check.outputs.needs_merge == 'true' && steps.smart.outputs.needs_review == 'true'
        env:
          GH_TOKEN: ${{ secrets.LOTUS_ACTIONS_PAT }}
        run: |
          BRANCH="libernt-sync/$(date -u +%Y%m%d-%H%M%S)"
          git switch -c "$BRANCH"
          git push origin "$BRANCH"
          gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$BRANCH" \
            --title "Sync LiberNT upstream (needs review)" \
            --body-file "$RUNNER_TEMP/galaxy/review.md"

      - name: Add report to job summary
        if: always() && steps.check.outputs.needs_merge == 'true'
        run: |
          [ -f "$RUNNER_TEMP/galaxy/review.md" ] && cat "$RUNNER_TEMP/galaxy/review.md" >> "$GITHUB_STEP_SUMMARY" || true
